name: device-olfactometer test suite

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev*
      - release*
  release:
    types: [published]

jobs:
  # ╔──────────────────────────╗
  # │   _____         _        │
  # │  |_   _|__  ___| |_ ___  │
  # │    | |/ _ \/ __| __/ __| │
  # │    | |  __/\__ \ |_\__ \ │
  # │    |_|\___||___/\__|___/ │
  # │                          │
  # ╚──────────────────────────╝
  tests:
    runs-on: windows-latest
    name: device-olfactometer unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Run ruff format
        run: uv run ruff format

      - name: Run ruff check
        run: uv run ruff check

      - name: Run codespell
        run: uv run codespell

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup Bonsai environment
        working-directory: ./.bonsai
        run: ./setup.ps1

      - name: Run python unit tests
        run: uv run python -m unittest

      - name: Regenerate schemas
        run: uv run device-olfactometer regenerate

      - name: Check for uncommitted changes
        run: |
          git config --global core.safecrlf false
          git diff --exit-code || (echo "Untracked changes found" && exit 1)

  # ╔─────────────────────────────────────────────────────────────────╗
  # │   ____                                    ____      _           │
  # │  |  _ \ _ __ ___ _ __   __ _ _ __ ___    |  _ \ ___| |          │
  # │  | |_) | '__/ _ \ '_ \ / _` | '__/ _ \   | |_) / _ \ |          │
  # │  |  __/| | |  __/ |_) | (_| | | |  __/   |  _ <  __/ |          │
  # │  |_|   |_|  \___| .__/ \__,_|_|  \___|   |_| \_\___|_|          │
  # │                 |_|                                             │
  # ╚─────────────────────────────────────────────────────────────────╝
  #
  # Releases are cut by hand: publish a GitHub release with the tag you want
  # (e.g. v0.2.1) and this job makes the code agree with it. Nothing is released
  # automatically on push, so `main` never gains a version the tag does not match.

  prepare-release:
    runs-on: ubuntu-latest
    name: Set version and regenerate schemas
    needs: tests
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          # `main` is unprotected here, so the default token can push. If a branch
          # ruleset is ever added, swap this for a PAT from an admin account as
          # Aind.Behavior.VrForaging does (`token: ${{ secrets.RELEASE_PAT }}`).

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          version=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Setting version to: $version"

      - name: Validate version
        run: uv version ${{ steps.get_version.outputs.version }} --dry-run

      - name: Set version
        run: uv version ${{ steps.get_version.outputs.version }}

      - name: Regenerate schemas
        run: uv run device-olfactometer regenerate

      - name: Commit version and schema changes, and move the release tag
        shell: bash
        run: |
          git config --global core.safecrlf false
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Set version ${{ steps.get_version.outputs.version }} and regenerate schemas [skip ci]"
            git push origin main
          fi
          # Point the release tag at the commit that actually declares this version.
          git tag -fa "${{ github.event.release.tag_name }}" -m "${{ github.event.release.tag_name }}"
          git push origin "${{ github.event.release.tag_name }}" --force

  # ╔─────────────────────────╗
  # │   ____                  │
  # │  |  _ \  ___   ___ ___  │
  # │  | | | |/ _ \ / __/ __| │
  # │  | |_| | (_) | (__\__ \ │
  # │  |____/ \___/ \___|___/ │
  # │                         │
  # ╚─────────────────────────╝
  build-docs:
    name: Build and deploy documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: [tests, prepare-release]
    if: |
      always()
      && needs.tests.result == 'success'
      && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
      && (
        (github.event_name == 'release' && !github.event.release.prerelease)
        || github.event_name == 'workflow_dispatch'
      )
    concurrency:
      group: build-docs
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Install docs group of dependencies
        run: uv sync --group docs

      - name: Build Sphinx documentation
        run: uv run sphinx-build -b html docs/ _build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
          force_orphan: true
