[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "aind-behavior-device-olfactometer"
description = "A library that can be used to generate models and configuration files for the harp olfactometer device."
authors = [{ name = "Bruno Cruz", email = "bruno.cruz@alleninstitute.org" }]
license = { text = "MIT" }
requires-python = ">=3.11"
version = "0.2.0rc1"
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]

dependencies = ["aind_behavior_services>=0.13.5, <0.14", "pydantic-settings"]

[project.urls]
Documentation = "https://allenneuraldynamics.github.io/Aind.Behavior.Device.Olfactometer/"
Repository = "https://github.com/AllenNeuralDynamics/Aind.Behavior.Device.Olfactometer/"
Issues = "https://github.com/AllenNeuralDynamics/Aind.Behavior.Device.Olfactometer/issues"
Changelog = "https://github.com/AllenNeuralDynamics/Aind.Behavior.Device.Olfactometer/releases"

[project.optional-dependencies]

launcher = ["aind-clabe[aind-services]>=0.10.0"]

data = [
    "contraqctor>= 0.5.3, < 0.6",
    "numpy",
    "pandas",
    "matplotlib",
    "jupyter",
]

[dependency-groups]

dev = [
    "aind_behavior_device_olfactometer[launcher]",
    "aind_behavior_device_olfactometer[data]",
    "ruff",
    "codespell",
]

docs = [
    'Sphinx<7.3',
    'furo',
    'sphinx-jinja',
    'autodoc_pydantic[erdantic]',
    'sphinx-jsonschema',
    'sphinx-copybutton',
    "sphinx_mdinclude",
]


[project.scripts]
device-olfactometer = "aind_behavior_device_olfactometer.cli:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'


[tool.uv]
default-groups = ['dev']
required-version = '>=0.8.4'
